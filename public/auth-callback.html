<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrando · Vinilo Tracks</title>
<meta name="description" content="Iniciando sesión.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23060706' stroke='%23b6ff3b' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23b6ff3b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="callback">
<div id="site-header"></div>
<main><div class="wrap loading-page"><div class="loader" aria-hidden="true"></div><p class="mono muted" id="cb-msg">Entrando a tu cuenta…</p></div></main>
<script>
/* Supabase regresa aquí después de Google (o de confirmar el correo)
   con la sesión en la URL: #access_token=...&refresh_token=...  */
(async function () {
  const p = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  const volver = (() => { try { return sessionStorage.getItem("vt-volver") || "/"; } catch { return "/"; } })();
  const msg = document.getElementById("cb-msg");
  if (p.get("error_description")) { msg.textContent = "No pudimos entrar: " + p.get("error_description"); return; }
  if (!p.get("access_token")) { location.replace(volver); return; }
  try {
    const r = await fetch("/api/auth/sesion", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ access_token: p.get("access_token"), refresh_token: p.get("refresh_token"), expires_in: p.get("expires_in") })
    });
    if (!r.ok) throw new Error();
    history.replaceState(null, "", "/auth/callback"); // borra los tokens de la barra de direcciones
    location.replace(volver);
  } catch { msg.textContent = "No pudimos entrar. Intenta otra vez."; }
})();
</script>
<div id="site-footer"></div>
<script src="/js/core.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/cuenta-ui.js"></script>

</body>
</html>
