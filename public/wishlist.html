<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu wishlist · Vinilo Tracks</title>
<meta name="description" content="Tu lista de vinilos guardados en Vinilo Tracks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23060706' stroke='%23b6ff3b' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23b6ff3b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="wishlist">
<div id="site-header"></div>
<main>
  <div class="wrap page-head">
    <span class="eyebrow">Guardados</span>
    <h1>Tu wishlist</h1>
    <p>Los vinilos que quieres conseguir. Se guardan en este navegador.</p>
    <div class="list-bar">
      <span class="mono muted" id="wl-total"></span>
      <div class="wl-tools" id="wl-acciones">
        <select id="wl-orden" aria-label="Ordenar"><option value="reciente">Guardados recientemente</option><option value="artista">Artista A – Z</option><option value="anio">Año</option></select>
        <button class="chip" id="wl-copiar" type="button">Copiar lista</button>
        <button class="chip" id="wl-vaciar" type="button">Vaciar lista</button>
      </div>
    </div>
  </div>
  <div class="wrap page-body"><div class="wl-grid" id="wl-grid"></div></div>
</main>
<div id="site-footer"></div>
<script src="/js/core.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/cuenta-ui.js"></script>
<script src="/js/wishlist-page.js"></script>
</body>
</html>
